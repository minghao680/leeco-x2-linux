name: Build downstream pmOS image (leeco-x2-ds)

# Route A: pmOS userland on the 3.18 downstream kernel (the daily-driver
# kernel family, same as the Le Pro3 zl1 port in pmaports). Produces a
# boot.img (kernel + QCDT + initramfs) and a rootfs image for userdata.

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "UI to install"
        required: true
        default: "console"
        type: choice
        options: [console, none]
  push:
    paths:
      - "device/downstream/**"
      - ".github/workflows/downstream-image.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Build image in container
        env:
          PMB_UI: ${{ github.event.inputs.ui || 'console' }}
        run: |
          set -e
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            -e PMB_UI \
            alpine:3.20 \
            /bin/sh -c "
              set -e -o pipefail
              apk add --no-cache git python3 py3-pip openssl device-mapper \
                                 e2fsprogs doas tzdata multipath-tools losetup

              adduser -D -s /bin/sh pmos
              echo \"permit nopass pmos\" > /etc/doas.d/00-pmos.conf
              mkdir -p /pmos-work && chown pmos:pmos /pmos-work

              git clone --depth 1 https://github.com/external-mirrors/pmbootstrap.git /tmp/pmbootstrap
              cd /tmp/pmbootstrap
              python3 -m venv /tmp/venv
              . /tmp/venv/bin/activate
              pip install --no-cache-dir -e .
              /tmp/venv/bin/pmbootstrap --version

              git clone --depth 1 https://github.com/external-mirrors/pmaports.git /tmp/pmaports

              # The pmaports/pmbootstrap clones are root-owned but pmbootstrap
              # runs as pmos: git refuses "dubious ownership" (exit 128) until
              # they are marked safe in the pmos user's own git config
              # (--system would need /etc/gitconfig write access, which pmos
              # does not have - that silent failure killed the whole script)
              git config --global --add safe.directory /tmp/pmaports
              git config --global --add safe.directory /tmp/pmbootstrap

              echo MARK-after-clones
              cp -r /work/device/downstream/device-leeco-x2-ds \
                    /tmp/pmaports/device/testing/device-leeco-x2-ds
              cp -r /work/device/downstream/linux-leeco-x2-ds \
                    /tmp/pmaports/device/testing/linux-leeco-x2-ds

              # DEBUG: dump the work-path validation source BEFORE running
              # pmbootstrap (its errors go to log.txt which may not exist)
              F=\$(grep -rln \"must not be inside the pmbootstrap path\" /tmp/pmbootstrap/pmb/ | head -1)
              echo \"check source file: \$F\"
              grep -n -B25 -A12 \"must not be inside the pmbootstrap path\" \"\$F\" || true

              echo MARK-before-init
              printf \"\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\" | su pmos -c \"/tmp/venv/bin/pmbootstrap --work /pmos-work --aports /tmp/pmaports init\" 2>&1
              echo MARK-after-init
              su pmos -c \"/tmp/venv/bin/pmbootstrap --work /pmos-work --aports /tmp/pmaports config device leeco-x2-ds\"
              su pmos -c \"/tmp/venv/bin/pmbootstrap --work /pmos-work --aports /tmp/pmaports config ui console\"

              echo MARK-before-install
              su pmos -c \"/tmp/venv/bin/pmbootstrap --work /pmos-work --aports /tmp/pmaports install\" 2>&1

              cp /pmos-work/log.txt /work/out-downstream/pmbootstrap-log.txt 2>/dev/null || true
              mkdir -p /work/out-downstream
              find /pmos-work -maxdepth 5 \( -name \"boot.img\" -o -name \"*.img\" \) -exec cp {} /work/out-downstream/ \; 2>/dev/null || true

              # DEBUG: dump the work-path validation source for the log
              F=\$(grep -rln \"must not be inside the pmbootstrap path\" /tmp/pmbootstrap/pmb/ | head -1)
              echo \"check source file: \$F\"
              grep -n -B25 -A10 \"must not be inside the pmbootstrap path\" \"\$F\" || true
              ls -lh /work/out-downstream/ || echo \"no images produced\"
            "

      - name: Upload image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-image-x2-${{ github.run_number }}
          path: out-downstream/
          if-no-files-found: warn
          retention-days: 14




